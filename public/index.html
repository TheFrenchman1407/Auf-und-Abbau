<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hallen-Inventur</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inventur">
<meta name="theme-color" content="#0f1311">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f1311;--card:#1a1f1d;--ink:#eef1ee;--muted:#93a09a;--line:#2a3230;--accent:#3fbf96;--accent-ink:#0b1712;--accent-soft:#1c3129;
    --warn:#f2a65a;--warn-soft:#33261a;--bad:#ef7b72;--bad-soft:#3a1f1d;--r:14px;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;-webkit-tap-highlight-color:transparent}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 20px 0;border-bottom:1px solid var(--line)}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:22px;margin:0;font-weight:700}
  .status{font-size:13px;color:var(--muted);margin-left:auto}
  .status.bad{color:var(--bad)}
  nav{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
  nav button{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:12px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  nav button.on{color:var(--ink);border-color:var(--accent)}
  .badge{display:inline-block;min-width:22px;padding:1px 7px;border-radius:99px;font-size:12px;margin-left:6px;background:var(--line);color:var(--ink);text-align:center}
  .badge.warn{background:var(--warn);color:#1a1206}.badge.bad{background:var(--bad);color:#1a0b0a}
  main{padding:18px 20px 100px;max-width:1100px;margin:0 auto}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
  textarea{min-height:80px;width:100%}
  .search{flex:1;min-width:200px}
  .btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:0 18px;min-height:46px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.danger{background:var(--bad);color:#1a0b0a}
  .btn.small{min-height:38px;padding:0 12px;font-size:14px}
  .cat{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
  .item.low{border-color:var(--warn);box-shadow:inset 4px 0 0 var(--warn)}
  .item.empty0{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
  .row{display:flex;align-items:center;gap:10px}
  .name{font-weight:600;font-size:17px;flex:1}
  .meta{font-size:13px;color:var(--muted)}
  .pill{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.bad{background:var(--bad-soft);color:var(--bad)}
  .pill.info{background:var(--accent-soft);color:var(--accent)}
  .counters{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
  .counter .lbl{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
  .qty{display:flex;align-items:center;gap:8px}
  .qbtn{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:24px;font-weight:600;cursor:pointer;line-height:1}
  .qbtn:active{background:var(--accent-soft)}
  .qnum{font-size:26px;font-weight:700;min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
  .actions{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
  .list{display:flex;flex-direction:column;gap:8px}
  .line{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .line.warn{border-left:5px solid var(--warn)} .line.bad{border-left:5px solid var(--bad)}
  .line .grow{flex:1;min-width:180px}
  .empty{color:var(--muted);text-align:center;padding:40px 10px;background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
  .alert{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;font-weight:600;cursor:pointer;display:flex;gap:10px;align-items:center}
  .alert.bad{background:var(--bad-soft);color:var(--bad)}
  dialog{border:0;border-radius:18px;padding:0;width:min(520px,94vw);background:var(--card);color:var(--ink)}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  .dlg{padding:20px;display:flex;flex-direction:column;gap:12px}
  .dlg h2{margin:0 0 4px;font-size:19px}
  .dlg label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
  .dlg label.chk{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:15px;font-weight:500}
  .dlg label.chk input{min-height:auto;width:22px;height:22px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
  .foot .left{margin-right:auto}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:500;opacity:0;transition:.2s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  .ro .edit-only{display:none!important}
  #gate{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;align-items:center;justify-content:center;padding:20px}
  #gate.show{display:flex}
  .gatebox{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:14px}
  .gatebox h2{margin:0;font-size:22px}
  .gatebox input{width:100%;font-size:18px}
  .spinner{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:6px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .role{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--line)}
  .role.master{background:var(--accent);color:var(--accent-ink)}
</style>
</head>
<body>
<div id="gate"></div>

<header>
  <div class="top">
    <h1>🏐 Hallen-Inventur</h1>
    <span class="status" id="status">Verbinde…</span>
    <button class="btn ghost small" id="meBtn">👤</button>
  </div>
  <nav id="tabs">
    <button data-tab="bestand" class="on">Bestand</button>
    <button data-tab="nachkauf">Nachkaufen <span class="badge" id="b-low">0</span></button>
    <button data-tab="ausleihe">Ausleihe <span class="badge" id="b-loan">0</span></button>
    <button data-tab="defekte">Defekte <span class="badge" id="b-def">0</span></button>
    <button data-tab="nutzer" id="tabNutzer" style="display:none">Nutzer <span class="badge" id="b-usr">0</span></button>
  </nav>
</header>
<main id="main"></main>

<dialog id="dItem"><form class="dlg" id="fItem">
  <h2 id="dItemTitle">Artikel</h2>
  <label>Name<input name="name" required placeholder="z. B. Kiste Wasser"></label>
  <div class="two">
    <label>Kategorie<input name="category" list="cats" placeholder="z. B. Getränke"></label>
    <label>Ort / Schrank<input name="location" list="locs" placeholder="z. B. Getränke-Raum"></label>
  </div>
  <label class="chk"><input type="checkbox" name="halves"> Angebrochene zählen (z. B. halbe Kisten)</label>
  <div class="two">
    <label>Bestand (voll)<input name="qty" type="number" min="0" inputmode="numeric" value="0"></label>
    <label id="openedWrap">Davon angebrochen<input name="opened" type="number" min="0" inputmode="numeric" value="0"></label>
  </div>
  <label>Mindestmenge – ab hier „Nachkaufen“<input name="minQty" type="number" min="0" inputmode="numeric" value="0"></label>
  <div class="meta" style="margin-top:-6px">Beispiel: Mindestmenge 2 → bei 2 oder weniger erscheint der Artikel unter „Nachkaufen“. 0 = keine Warnung.</div>
  <label>Notiz<input name="note" placeholder="optional"></label>
  <div class="foot">
    <button type="button" class="btn danger small left" id="delItem">Löschen</button>
    <button type="button" class="btn ghost" data-close>Abbrechen</button>
    <button class="btn">Speichern</button>
  </div>
</form></dialog>

<dialog id="dLoan"><form class="dlg" id="fLoan">
  <h2>Ausleihen</h2>
  <label>Artikel<select name="itemId" required id="loanItem"></select></label>
  <div class="two">
    <label>Anzahl<input name="qty" type="number" min="1" value="1" inputmode="numeric"></label>
    <label>Wer?<input name="borrower" required placeholder="Name / Mannschaft"></label>
  </div>
  <label>Notiz<input name="note" placeholder="z. B. Auswärtsspiel Samstag"></label>
  <div class="foot"><button type="button" class="btn ghost" data-close>Abbrechen</button><button class="btn">Ausleihe eintragen</button></div>
</form></dialog>

<dialog id="dRep"><form class="dlg" id="fRep">
  <h2>Defekt / Zustand melden</h2>
  <label>Artikel<select name="itemId" required id="repItem"></select></label>
  <label>Was ist los?<textarea name="text" required placeholder="z. B. Kühlschrank kühlt nicht mehr"></textarea></label>
  <label>Betroffene Anzahl<input name="qty" type="number" min="1" value="1" inputmode="numeric"></label>
  <label class="chk"><input type="checkbox" name="deduct"> Aus dem Bestand abziehen (nicht mehr nutzbar)</label>
  <div class="foot"><button type="button" class="btn ghost" data-close>Abbrechen</button><button class="btn">Melden</button></div>
</form></dialog>

<dialog id="dAsk"><div class="dlg">
  <h2 id="askTitle">Sicher?</h2>
  <div id="askText" class="meta"></div>
  <div class="foot"><button class="btn ghost" id="askNo">Abbrechen</button><button class="btn danger" id="askYes">Ja</button></div>
</div></dialog>

<dialog id="dMe"><div class="dlg">
  <h2 id="meName"></h2>
  <div id="meRole" class="meta"></div>
  <div class="foot">
    <button class="btn danger small left" id="logout">Dieses Gerät abmelden</button>
    <button class="btn ghost" data-close>Schließen</button>
  </div>
</div></dialog>

<datalist id="cats"></datalist><datalist id="locs"></datalist>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
